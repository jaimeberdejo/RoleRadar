# ── BuscadorDeEmpleo — Docker Compose ────────────────────────────────────────
#
# Uso:
#   docker compose up --build        # primera vez (build + arranque)
#   docker compose up -d             # arranque en background
#   docker compose down              # parar y eliminar contenedores
#   docker compose restart           # reiniciar (la DB y el modelo persisten)
#
# NOTA DE SEGURIDAD: RAPIDAPI_KEY / JSEARCH_KEY no van aquí.
# Esas claves pertenecen a n8n, que llama a las APIs de empleo directamente
# (Arbeitnow, JSearch, FlyByAPIs). Este servicio solo recibe las ofertas ya
# obtenidas por n8n vía POST /jobs/process. Mantenerlas aquí filtraría las
# credenciales si la imagen o el compose se publican.

services:
  buscadordeempleo:
    build: .
    image: buscadordeempleo:latest
    ports:
      - "8000:8000"

    # OPENAI_API_KEY y otras variables se inyectan desde el fichero .env local.
    # El .env está en .dockerignore y en .gitignore: NUNCA se copia en la imagen.
    # Si .env no existe, Compose falla con un error claro antes de arrancar.
    env_file:
      - .env

    environment:
      # HF_HOME también se define en el Dockerfile; se repite aquí para que
      # pueda sobreescribirse desde el shell sin rebuild:
      #   HF_HOME=/otro/path docker compose up
      HF_HOME: /app/.cache/huggingface

      # Ruta de la DB dentro del contenedor, apuntando al volumen montado.
      # Sin esto, el código usaría el default relativo "data/jobs.db" dentro
      # del contenedor y la DB se perdería al recrear el contenedor.
      SQLITE_DB_PATH: /app/data/jobs.db

    volumes:
      # Volumen named para la DB SQLite.
      # La DB sobrevive a docker compose restart y a la recreación del contenedor.
      # Para inspeccionar la ruta real en el host:
      #   docker volume inspect buscadordeempleo_data
      - data:/app/data

      # Volumen named para el modelo BGE-M3 (~2.3 GB).
      # El modelo se descarga en la primera llamada a /jobs/process desde
      # HuggingFace y se guarda aquí. Las llamadas siguientes usan la caché.
      # Evita re-descargar 2.3 GB en cada restart del contenedor.
      - hf_cache:/app/.cache/huggingface

    healthcheck:
      # /health responde 200 de inmediato sin cargar el modelo BGE-M3.
      # Se usa python -c en lugar de curl/wget para no añadir dependencias extra.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      # start_period: tiempo de gracia antes de que fallen los healthchecks.
      # 60s conservador: /health responde rápido, pero da margen al arranque
      # inicial de uvicorn y a posibles lentitudes de disco en el primer boot.
      start_period: 60s

    restart: unless-stopped

# ── Volúmenes named ───────────────────────────────────────────────────────────
# Named volumes (no bind mounts): Docker gestiona la ruta en el host.
# Ventajas sobre bind mounts:
#   - Portables entre máquinas y SOs.
#   - El usuario no necesita crear directorios en el host.
#   - `docker volume inspect` muestra la ruta real si se necesita hacer backup.
volumes:
  data:
    driver: local
  hf_cache:
    driver: local
